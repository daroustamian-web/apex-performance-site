<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Blog — Apex Performance &amp; Recovery</title>
<meta name="description" content="Field notes from Apex Performance &amp; Recovery — peptides, recovery, training, and the science behind real transformation." />
<link rel="icon" href="/favicon.ico" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400..700;1,400..700&family=DM+Sans:wght@400;500;600&display=swap" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0A0A0C;--bg-soft:#101015;--bg-card:#13131A;--fg:#EDEDF0;--muted:rgba(237,237,240,0.65);--dim:rgba(237,237,240,0.40);--red:#C8102E;--blue:#00B4FF;--silver:#C8CDD3;--border:rgba(255,255,255,0.09);--border-strong:rgba(255,255,255,0.18)}
  html,body{background:var(--bg);color:var(--fg);font-family:"DM Sans",ui-sans-serif,system-ui,sans-serif;font-weight:400;line-height:1.6;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  a{color:inherit;text-decoration:none}
  .blog-nav{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(10,10,12,0.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:10}
  .blog-nav a.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;font-family:"Fraunces";font-weight:600;letter-spacing:-0.02em;line-height:1;color:var(--fg)}
  .blog-nav a.brand .mark{font-size:22px;letter-spacing:0.04em;text-transform:uppercase;color:var(--fg)}
  .blog-nav a.brand .mark::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);margin-left:6px;transform:translateY(-2px);box-shadow:0 0 12px var(--red-glow,rgba(200,16,46,0.5))}
  .blog-nav a.brand .sub{font-family:"DM Sans";font-weight:500;font-size:11px;color:var(--muted);letter-spacing:0.16em;text-transform:uppercase;display:none}
  @media (min-width:760px){.blog-nav a.brand .sub{display:inline}}
  .blog-nav .right{display:flex;gap:24px;font-size:14px;color:var(--muted)}
  .blog-nav .right a{transition:color .2s ease}
  .blog-nav .right a:hover{color:var(--fg)}
  .blog-wrap{flex:1;width:100%;max-width:780px;margin:0 auto;padding:clamp(48px,7vw,88px) 28px}
  .blog-eyebrow{font-family:"Fraunces";font-weight:500;font-style:italic;font-size:13px;color:var(--red);letter-spacing:0.18em;text-transform:uppercase}
  .blog-title{font-family:"Fraunces";font-weight:600;font-size:clamp(40px,5vw,64px);letter-spacing:-0.025em;line-height:1.04;margin:14px 0 14px}
  .blog-lead{color:var(--muted);font-size:17px;max-width:60ch;margin-bottom:48px}
  .post-list{list-style:none;display:flex;flex-direction:column;gap:2px}
  .post-list li{border-top:1px solid var(--border)}
  .post-list li:last-child{border-bottom:1px solid var(--border)}
  .post-list a{display:flex;align-items:baseline;gap:18px;padding:22px 4px;transition:background .2s ease,padding .2s ease}
  .post-list a:hover{background:var(--bg-soft);padding-left:14px}
  .post-list .date{font-family:"DM Sans";font-size:13px;color:var(--dim);letter-spacing:0.04em;flex-shrink:0;min-width:110px}
  .post-list .title{font-family:"Fraunces";font-weight:500;font-size:24px;letter-spacing:-0.01em;line-height:1.2;color:var(--fg);flex:1}
  .post-list .arrow{color:var(--red);opacity:0;transition:opacity .2s ease}
  .post-list a:hover .arrow{opacity:1}
  .blog-empty,.blog-error{text-align:center;padding:80px 20px;color:var(--muted)}
  .blog-empty .icon,.blog-error .icon{font-size:36px;margin-bottom:14px;display:block}
  .blog-loading{padding:24px 0;color:var(--dim);font-size:14px;text-align:center}
  .blog-foot{border-top:1px solid var(--border);padding:32px 28px;font-size:13px;color:var(--dim);text-align:center}
  .blog-foot a{color:var(--silver);text-decoration:underline;text-decoration-color:rgba(200,205,211,0.3);text-underline-offset:3px}
  @media (max-width:640px){
    .post-list a{flex-direction:column;gap:6px;padding:18px 4px}
    .post-list .date{min-width:0}
    .post-list .title{font-size:20px}
  }
</style>
</head>
<body>

<nav class="blog-nav">
  <a class="brand" href="/" aria-label="Apex Performance &amp; Recovery — home">
    <span class="mark">Apex</span>
    <span class="sub">Performance &amp; Recovery</span>
  </a>
  <div class="right">
    <a href="/">Home</a>
    <a href="/#book">Book a session</a>
  </div>
</nav>

<main class="blog-wrap">
  <div class="blog-eyebrow">Field notes</div>
  <h1 class="blog-title">Apex Performance Blog</h1>
  <p class="blog-lead">Peptides, recovery, training, transformation. Plain-language essays from inside the gym.</p>

  <div id="postsContainer">
    <div class="blog-loading">Loading posts&hellip;</div>
  </div>
</main>

<footer class="blog-foot">
  &copy; <span id="year"></span> Apex Performance &amp; Recovery · Bohemia, Long Island · <a href="/">apex-performance.life</a>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  // Hardcoded repo identity — change here if the repo location moves.
  const REPO_OWNER = 'daroustamian-web';
  const REPO_NAME = 'apex-performance-site';
  const BRANCH = 'main';
  const POSTS_PATH = 'content/blog';

  const container = document.getElementById('postsContainer');

  function parseFrontmatter(md) {
    const m = md.match(/^---\s*\n([\s\S]*?)\n---\s*\n?/);
    if (!m) return { fm: {}, body: md };
    const fm = {};
    m[1].split('\n').forEach(line => {
      const kv = line.match(/^([A-Za-z_]+):\s*(.*)$/);
      if (!kv) return;
      let val = kv[2].trim();
      if ((val.startsWith('"') && val.endsWith('"')) || (val.startsWith("'") && val.endsWith("'"))) {
        val = val.slice(1, -1);
      }
      fm[kv[1]] = val;
    });
    return { fm, body: md.slice(m[0].length) };
  }

  function slugFromFilename(filename) {
    return filename.replace(/\.md$/, '');
  }

  function dateFromSlug(slug, fmDate) {
    if (fmDate) return fmDate.slice(0, 10);
    const m = slug.match(/^(\d{4}-\d{2}-\d{2})/);
    return m ? m[1] : '';
  }

  function formatDate(iso) {
    if (!iso) return '';
    const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) {
      const d = new Date(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3]));
      return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
    }
    return iso;
  }

  async function load() {
    try {
      const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${POSTS_PATH}?ref=${BRANCH}`;
      const listRes = await fetch(apiUrl);
      if (!listRes.ok) {
        if (listRes.status === 404) {
          container.innerHTML = '<div class="blog-empty"><span class="icon">📝</span>No posts yet. Check back soon.</div>';
          return;
        }
        throw new Error(`GitHub API ${listRes.status}`);
      }
      const files = (await listRes.json())
        .filter(f => f.type === 'file' && f.name.endsWith('.md'));

      if (files.length === 0) {
        container.innerHTML = '<div class="blog-empty"><span class="icon">📝</span>No posts yet. Check back soon.</div>';
        return;
      }

      const posts = await Promise.all(files.map(async f => {
        const md = await fetch(f.download_url).then(r => r.text());
        const { fm } = parseFrontmatter(md);
        const slug = slugFromFilename(f.name);
        return {
          slug,
          title: fm.title || slug,
          date: dateFromSlug(slug, fm.date),
          rawDate: fm.date || ''
        };
      }));

      posts.sort((a, b) => (b.date || '').localeCompare(a.date || ''));

      const html = '<ul class="post-list">' + posts.map(p => `
        <li>
          <a href="/blog/${encodeURIComponent(p.slug)}">
            <span class="date">${formatDate(p.date)}</span>
            <span class="title">${escapeHtml(p.title)}</span>
            <span class="arrow" aria-hidden="true">→</span>
          </a>
        </li>
      `).join('') + '</ul>';

      container.innerHTML = html;
    } catch (err) {
      container.innerHTML = `<div class="blog-error"><span class="icon">⚠</span>Couldn't load posts. ${escapeHtml(err.message)}</div>`;
    }
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  load();
</script>
</body>
</html>
